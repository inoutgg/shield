version: "2"
sql:
  - schema: "sql/schema.sql"
    queries:
      - "internal/dbsqlc/session_query.sql"
      - "internal/dbsqlc/password_query.sql"
      - "internal/dbsqlc/passkey_query.sql"
      - "internal/dbsqlc/recovery_code_query.sql"
      - "internal/dbsqlc/user_query.sql"
      - "internal/dbsqlc/mfa_query.sql"
      - "internal/dbsqlc/workspace_query.sql"
    engine: "postgresql"
    gen:
      go: &x-common-gen-go
        package: "dbsqlc"
        sql_package: "pgx/v5"
        out: "internal/dbsqlc"
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: true
        emit_all_enum_values: true
        emit_interface: true
        overrides:
          ###########################
          # per type overrides      #
          ###########################

          - db_type: "pg_catalog.timestamptz"
            go_type:
              type: "time.Time"
            nullable: false
          - db_type: "pg_catalog.timestamptz"
            go_type:
              type: "time.Time"
            nullable: true

          ###########################
          # per table overrides     #
          ###########################

  - schema: "sql/schema.sql"
    queries:
      - "internal/dbsqlctest/user_query.sql"
      - "internal/dbsqlctest/password_query.sql"
      - "internal/dbsqlctest/mfa_query.sql"
    engine: "postgresql"
    gen:
      go:
        <<: *x-common-gen-go
        package: "dbsqlctest"
        out: "internal/dbsqlctest"
